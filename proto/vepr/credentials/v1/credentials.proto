// Protocol Buffers definition for internal credential and signature verification operations.
syntax = "proto3";

package vepr.credentials.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "CredentialsProto";
option java_package = "io.vepr.contracts.credentials.v1";

// CredentialService provides device credential lookup and signature verification.
//
// Security & Transport:
//   - Transport: gRPC over mTLS (port 9092).
//   - Authorization: Only callers presenting a client certificate with URI SAN
//     `spiffe://vepr.local/svc/authorization` (the `authorization` identity) may call.
//     All other identities are rejected.
//
// Operational Invariants:
//   - VerifySignature always reads live device status directly from the database (no caching).
//     A revoked device fails verification immediately on the very next call.
//
// Caller Deadlines:
//   - GetDevicesForCustomer: callers should enforce a deadline of 300 ms.
//   - VerifySignature: callers should enforce a deadline of 500 ms.
service CredentialService {
  // VerifySignature verifies an ECDSA P-256 signature produced by an enrolled device key.
  // Always performs a live database lookup of device status.
  rpc VerifySignature(VerifySignatureRequest) returns (VerifySignatureResponse);

  // GetDevicesForCustomer returns all enrolled devices for a customer reference.
  rpc GetDevicesForCustomer(GetDevicesForCustomerRequest) returns (GetDevicesForCustomerResponse);
}

// KeyType distinguishes which hardware-backed key on the device produced the signature.
enum KeyType {
  // Key type is unspecified.
  KEY_TYPE_UNSPECIFIED = 0;

  // Secure Enclave device key (non-biometric). Used for device tokens and denial signatures.
  KEY_TYPE_DEVICE = 1;

  // Secure Enclave approval key (biometric-gated). Used for approval and pre-approval signatures.
  KEY_TYPE_APPROVAL = 2;
}

// VerificationResult details the exact outcome of a signature verification request.
enum VerificationResult {
  // Result is unspecified.
  VERIFICATION_RESULT_UNSPECIFIED = 0;

  // The signature is cryptographically valid and device is active.
  VERIFICATION_RESULT_VALID = 1;

  // The requested device does not exist in the tenant registry.
  VERIFICATION_RESULT_DEVICE_NOT_FOUND = 2;

  // The requested device has been revoked and can no longer sign transactions.
  VERIFICATION_RESULT_DEVICE_REVOKED = 3;

  // The device exists but is associated with a different tenant ID.
  VERIFICATION_RESULT_TENANT_MISMATCH = 4;

  // The key type used is not permitted for the payload type byte.
  VERIFICATION_RESULT_KEY_NOT_ALLOWED_FOR_PAYLOAD = 5;

  // The canonical payload could not be parsed according to the signing specification.
  VERIFICATION_RESULT_MALFORMED_PAYLOAD = 6;

  // The signature bytes are not a valid DER-encoded ECDSA signature.
  VERIFICATION_RESULT_MALFORMED_SIGNATURE = 7;

  // Cryptographic signature check failed against the registered public key.
  VERIFICATION_RESULT_BAD_SIGNATURE = 8;
}

// DeviceStatus represents the lifecycle state of an enrolled device.
enum DeviceStatus {
  // Device status is unspecified.
  DEVICE_STATUS_UNSPECIFIED = 0;

  // Device is active and authorized to sign transactions.
  DEVICE_STATUS_ACTIVE = 1;

  // Device has been explicitly revoked or superseded.
  DEVICE_STATUS_REVOKED = 2;
}

// AttestationType indicates the hardware attestation format validated at enrollment.
enum AttestationType {
  // Attestation type is unspecified.
  ATTESTATION_TYPE_UNSPECIFIED = 0;

  // Apple App Attest hardware attestation.
  ATTESTATION_TYPE_APP_ATTEST = 1;

  // No attestation (development, simulator, or sandbox only).
  ATTESTATION_TYPE_NONE = 2;
}

// VerifySignatureRequest encapsulates parameters for signature verification.
message VerifySignatureRequest {
  // Tenant identifier (UUIDv7 format).
  string tenant_id = 1;

  // Enrolled device identifier (UUIDv7 format).
  string device_id = 2;

  // Type of key that produced the signature.
  KeyType key_type = 3;

  // Raw canonical binary payload that was signed.
  bytes payload = 4;

  // DER-encoded ECDSA P-256 signature bytes.
  bytes signature = 5;
}

// VerifySignatureResponse contains the outcome of signature verification.
message VerifySignatureResponse {
  // True if and only if the signature is cryptographically valid and device is active.
  bool valid = 1;

  // Detailed result code explaining the verification outcome.
  VerificationResult result = 2;
}

// GetDevicesForCustomerRequest requests devices enrolled by a specific customer.
message GetDevicesForCustomerRequest {
  // Tenant identifier (UUIDv7 format).
  string tenant_id = 1;

  // Bank customer reference string.
  string customer_ref = 2;

  // When true, returns only devices with ACTIVE status; otherwise returns all.
  bool active_only = 3;
}

// Device represents an enrolled mobile device and its credentials metadata.
message Device {
  // Unique device identifier (UUIDv7 format).
  string device_id = 1;

  // Operating platform of the device (e.g. "ios").
  string platform = 2;

  // Current status of the device.
  DeviceStatus status = 3;

  // Attestation type validated during device enrollment.
  AttestationType attestation_type = 4;

  // Timestamp when the device was enrolled.
  google.protobuf.Timestamp enrolled_at = 5;
}

// GetDevicesForCustomerResponse contains the list of matching enrolled devices.
message GetDevicesForCustomerResponse {
  // List of devices matching the query criteria.
  repeated Device devices = 1;
}
