        - max_amount_minor
        - currency
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Pre-approval UUIDv7 identifier.
          example: "01925b6a-742e-7bb2-8098-b789ef012345"
        status:
          type: string
          enum:
            - ACTIVE
          description: Pre-approval status.
          example: "ACTIVE"
        max_amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Maximum allowed amount in minor units.
          example: 200000
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 currency code.
          example: "INR"
