        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 currency code.
          example: "INR"
        channel_scope:
          type: string
          enum:
            - card_present
          description: Scope of allowed transaction channels (v1 allows card_present only).
          example: "card_present"
        expires_at:
          type: string
          format: date-time
          description: Pre-approval challenge expiration timestamp.
          example: "2026-10-13T06:19:30.000Z"
        server_time:
          type: string
          format: date-time
          description: Current server clock timestamp.
          example: "2026-10-13T06:18:30.000Z"

    ActivatePreApprovalRequest:
