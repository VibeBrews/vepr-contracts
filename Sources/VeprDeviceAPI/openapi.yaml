    RegisterPushTokenRequest:
      type: object
      additionalProperties: false
      description: Device APNs push notification token registration.
      required:
        - token
        - apns_environment
        - bundle_id
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 200
          pattern: "^[0-9a-fA-F]{64,200}$"
          description: Hexadecimal APNs device token string (64 to 200 characters).
          example: "70a6c2f9d8e7b6a54321fedcba0987654321fedcba0987654321fedcba098765"
        apns_environment:
          type: string
          enum:
            - sandbox
            - production
          description: Apple Push Notification service target gateway environment.
