      required:
        - id
        - tenant_id
        - device_id
        - nonce
        - max_amount_minor
        - currency
        - channel_scope
        - expires_at
        - server_time
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Pre-approval UUIDv7 identifier.
          example: "01925b6a-742e-7bb2-8098-b789ef012345"
        tenant_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant identifier.
          example: "bank_sandbox"
        device_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Device UUIDv7 identifier.
          example: "01925b6a-742e-7bb2-8098-b789ef012345"
        nonce:
          type: string
          minLength: 43
          maxLength: 44
          description: 32 raw random bytes encoded as base64url without padding.
          example: "47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU"
        max_amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Maximum allowed amount in paise.
