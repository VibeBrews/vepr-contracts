      properties:
        challenges:
          type: array
          description: Array of pending challenges for the device.
          items:
            $ref: '#/components/schemas/PendingChallengeItem'
        server_time:
          type: string
          format: date-time
          description: Current server clock timestamp for client countdown alignment.
          example: "2026-10-13T06:18:30.000Z"

    Challenge:
      type: object
      additionalProperties: false
      description: Full challenge payload required for signing type 0x01 CHALLENGE_DECISION.
      required:
        - id
        - tenant_id
        - device_id
        - nonce
        - merchant
        - amount_minor
        - currency
        - channel
        - status
        - created_at
        - expires_at
        - server_time
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Challenge UUIDv7 identifier.
          example: "01925b6a-742e-7bb2-8098-b789ef012345"
        tenant_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant identifier.
          example: "bank_sandbox"
        device_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Device UUIDv7 identifier targeted by the challenge.
          example: "01925b6a-742e-7bb2-8098-b789ef012345"
        nonce:
          type: string
          minLength: 43
          maxLength: 44
          description: 32 raw random bytes encoded as base64url without padding.
          example: "47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU"
        merchant:
          $ref: './components/common.yaml#/components/schemas/Merchant'
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Amount in minor currency units (paise).
          example: 50000
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 upper-case currency code.
          example: "INR"
        channel:
          type: string
          enum:
            - card_present
            - qr
          description: Channel initiating the transaction.
          example: "card_present"
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - DENIED
            - EXPIRED
          description: Current challenge status.
          example: "PENDING"
        created_at:
          type: string
          format: date-time
          description: Challenge creation timestamp.
          example: "2026-10-13T06:18:27.123Z"
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp.
          example: "2026-10-13T06:18:52.123Z"
        server_time:
          type: string
          format: date-time
          description: Current server clock timestamp.
          example: "2026-10-13T06:18:30.000Z"

    SubmitDecisionRequest:
      type: object
      additionalProperties: false
      description: Customer decision accompanied by cryptographic signature.
      required:
        - decision
        - signature
      properties:
        decision:
          type: string
          enum:
            - approve
            - deny
          description: Decision choice. 'approve' requires biometric approval key; 'deny' requires device key.
          example: "approve"
        signature:
          type: string
          minLength: 1
          maxLength: 120
          description: Base64url-encoded ASN.1 DER ECDSA signature over canonical payload type 0x01.
          example: "MEQCIBx1Q5sE81GfV7H6zL3nS8vW2P9mK1bQ7cD0yE4fA5gGAiAK2vB6kL9sD1nW5pM3rT7qV0xY4zA8bC2dE6fH8iJ0lQ"

    SubmitDecisionResponse:
      type: object
      additionalProperties: false
      description: Recorded decision outcome.
      required:
        - id
        - status
        - decided_at
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Challenge UUIDv7 identifier.
          example: "01925b6a-742e-7bb2-8098-b789ef012345"
        status:
          type: string
          enum:
            - APPROVED
            - DENIED
          description: Final decision status.
          example: "APPROVED"
        decided_at:
          type: string
          format: date-time
          description: Timestamp when the decision was verified and finalized.
          example: "2026-10-13T06:18:31.456Z"

