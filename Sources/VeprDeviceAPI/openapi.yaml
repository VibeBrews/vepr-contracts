          type: string
          minLength: 1
          maxLength: 120
          description: Base64url-encoded ASN.1 DER ECDSA signature produced by the approval key over PRE_APPROVAL (type 0x02).
          example: "MEQCIBx1Q5sE81GfV7H6zL3nS8vW2P9mK1bQ7cD0yE4fA5gGAiAK2vB6kL9sD1nW5pM3rT7qV0xY4zA8bC2dE6fH8iJ0lQ"

    ActivatedPreApprovalResponse:
